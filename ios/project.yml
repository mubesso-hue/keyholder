# XcodeGen spec. Run `xcodegen generate` in this folder, then open Keyholder.xcodeproj.
# Fill in Config.xcconfig first (team id, bundle id, Supabase URL + anon key).

name: Keyholder

options:
  bundleIdPrefix: com.keyholder
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:

  Keyholder:
    type: application
    platform: iOS
    sources:
      - path: Keyholder
      - path: Shared
    dependencies:
      - package: Supabase
        product: Supabase
      - target: KeyholderMonitor
        embed: true
      - target: KeyholderShield
        embed: true
      - target: KeyholderShieldAction
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Keyholder/Info.plist
      properties:
        CFBundleDisplayName: Keyholder
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification, fetch]
        BGTaskSchedulerPermittedIdentifiers: ["$(APP_BUNDLE_ID).heartbeat"]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID)
            CFBundleURLSchemes: [keyholder]
        APP_GROUP_ID: $(APP_GROUP_ID)
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
    entitlements:
      path: Keyholder/Keyholder.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: ["$(APP_GROUP_ID)"]
        aps-environment: development
        com.apple.developer.applesignin: [Default]

  KeyholderMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: KeyholderMonitor
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).monitor
    info:
      path: KeyholderMonitor/Info.plist
      properties:
        CFBundleDisplayName: Keyholder Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MonitorExtension
        APP_GROUP_ID: $(APP_GROUP_ID)
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
    entitlements:
      path: KeyholderMonitor/KeyholderMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: ["$(APP_GROUP_ID)"]

  KeyholderShield:
    type: app-extension
    platform: iOS
    sources:
      - path: KeyholderShield
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).shield
    info:
      path: KeyholderShield/Info.plist
      properties:
        CFBundleDisplayName: Keyholder Shield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
        APP_GROUP_ID: $(APP_GROUP_ID)
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
    entitlements:
      path: KeyholderShield/KeyholderShield.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: ["$(APP_GROUP_ID)"]

  KeyholderShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: KeyholderShieldAction
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).shieldaction
    info:
      path: KeyholderShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Keyholder Shield Action
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
        APP_GROUP_ID: $(APP_GROUP_ID)
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
    entitlements:
      path: KeyholderShieldAction/KeyholderShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: ["$(APP_GROUP_ID)"]

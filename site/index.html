<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyholder</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0A0A0A; color:#fff; font:16px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,Arial,sans-serif; text-align:center; -webkit-font-smoothing:antialiased; }
  main { padding:40px 24px; max-width:520px; }
  .lock { width:96px; height:96px; margin:0 auto 28px; border-radius:50%; background:linear-gradient(135deg,#FFB347 0%,#FF7A00 50%,#FF4D00 100%); box-shadow:0 0 40px rgba(255,122,0,.45),0 0 100px rgba(255,77,0,.25); display:flex; align-items:center; justify-content:center; }
  .lock svg { width:40px; height:40px; stroke:#fff; fill:none; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
  h1 { font-size:44px; letter-spacing:-.03em; margin:0 0 8px; }
  p { color:rgba(255,255,255,.75); margin:0 0 28px; }
  a { color:#FF7A00; font-size:14px; }
</style>
</head>
<body>
<main>
  <div class="lock"><svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/><circle cx="12" cy="15.5" r="1"/></svg></div>
  <h1>Keyholder</h1>
  <p>Block the apps that eat your time. Only a friend can give it back.</p>
  <a href="/privacy">Privacy Policy</a>
